name: Deploy to VPS

on:
  push:
    branches: ['main']
  workflow_dispatch: # ← Optional: allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # ← Updated to v4 (latest)

      - name: Setup Node
        uses: actions/setup-node@v4 # ← Updated to v4
        with:
          node-version: 20
          cache: 'npm' # ← Speeds up installs

      - name: Install dependencies
        run: npm ci

      - name: Build Vite project
        run: npm run build

      # Optional: Remove debug secrets step in production (security)
      # - name: Debug Secrets
      #   run: ...

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "echo 'SSH OK – Deploying F2P Games Explorer'"

      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/charaf.dev/f2p.charaf.dev/
