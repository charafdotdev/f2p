name: Deploy to VPS

on:
  push:
    branches: [main] # triggers on push to main
  workflow_dispatch: # allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_APP_RAWG_KEY: ${{ secrets.VITE_APP_RAWG_KEY }} # if you use env vars

      - name: Deploy to VPS via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: 'dist/*' # or "build/*" if using CRA
          target: '/home/yourdomain.com/public_html/f2p/'
          strip_components: 1 # removes "dist" folder
          overwrite: true
